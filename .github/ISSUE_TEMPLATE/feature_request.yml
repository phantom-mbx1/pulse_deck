name: Feature Request
description: Propose a focused improvement or new capability for PulseDeck
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow gap
      description: What problem does this solve, and why does current behavior fall short?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the expected CLI commands, API fields, rules, or UI behavior.
    validations:
      required: true