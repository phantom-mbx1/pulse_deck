name: Good First Issue
description: A self-contained task suitable for first-time contributors
labels: ["good first issue", "help wanted"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Explain the small, focused improvement or test/documentation task.
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Relevant files
      placeholder: |
        - src/core/...
        - tests/...
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List clear conditions for when this issue is complete.
    validations:
      required: true